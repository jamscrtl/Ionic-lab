<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-list>
    <ion-list-header>Preferences</ion-list-header>

    <ion-item>
      <ion-icon name="moon-outline" slot="start"></ion-icon>
      <ion-toggle [(ngModel)]="darkMode">Dark Mode</ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-toggle [(ngModel)]="notifications">Notifications</ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon name="volume-high-outline" slot="start"></ion-icon>
      <ion-range [(ngModel)]="volume" min="0" max="100" [pin]="true">
        <ion-label slot="start">0</ion-label>
        <ion-label slot="end">100</ion-label>
      </ion-range>
    </ion-item>
  </ion-list>

  <ion-list>
    <ion-list-header>Account</ion-list-header>

    <ion-item button (click)="presentActionSheet()">
      <ion-label>Account Options (Action Sheet)</ion-label>
    </ion-item>

    <ion-item button (click)="confirmClearData()">
      <ion-icon name="trash-outline" slot="start" color="danger"></ion-icon>
      <ion-label color="danger">Clear App Data (Alert)</ion-label>
    </ion-item>
  </ion-list>

</ion-content>

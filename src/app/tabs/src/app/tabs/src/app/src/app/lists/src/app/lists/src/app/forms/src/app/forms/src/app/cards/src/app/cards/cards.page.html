<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cards</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Basic Card</ion-card-subtitle>
      <ion-card-title>Card Title</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      This is a plain ion-card with header and content only.
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-img src="https://ionicframework.com/docs/img/demos/card-media.png" alt="Sample"></ion-img>
    <ion-card-header>
      <ion-card-title>Card with Image</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      ion-img sits above the header for a media-first layout.
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Card with Actions</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Buttons placed inside ion-card-content act like a footer toolbar.
    </ion-card-content>
    <ion-button fill="clear">
      <ion-icon name="heart-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <ion-button fill="clear">
      <ion-icon name="bookmark-outline" slot="icon-only"></ion-icon>
    </ion-button>
    <ion-button fill="clear">
      <ion-icon name="share-social-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-card>

  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Grid Card 1</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Grid Card 2</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>

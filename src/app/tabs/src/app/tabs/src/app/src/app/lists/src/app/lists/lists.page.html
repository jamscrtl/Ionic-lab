<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Lists</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-list>
    <ion-list-header>Basic Items</ion-list-header>

    <ion-item>
      <ion-icon name="person-circle-outline" slot="start"></ion-icon>
      <ion-label>Basic ion-item</ion-label>
    </ion-item>

    <ion-item>
      <ion-avatar slot="start">
        <img alt="avatar" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
      </ion-avatar>
      <ion-label>Item with avatar</ion-label>
      <ion-badge slot="end">New</ion-badge>
    </ion-item>
  </ion-list>

  <ion-list>
    <ion-list-header>Sliding Items (swipe left)</ion-list-header>

    <ion-item-sliding *ngFor="let student of students">
      <ion-item>
        <ion-checkbox
          slot="start"
          [checked]="student.done"
          (ionChange)="toggleDone(student)">
        </ion-checkbox>
        <ion-label>
          <h2>{{ student.name }}</h2>
          <p>{{ student.course }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="warning">
          <ion-icon name="archive-outline" slot="icon-only"></ion-icon>
        </ion-item-option>
        <ion-item-option color="danger">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

</ion-content>
